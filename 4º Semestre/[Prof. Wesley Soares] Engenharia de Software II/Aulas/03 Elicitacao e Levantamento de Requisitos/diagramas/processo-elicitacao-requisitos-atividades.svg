<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:538px;height:663px;background:#FFFFFF;" width="538px" height="663px" viewBox="0 0 538 663" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="113.003" y="33.132" fill="#000" font-size="14" textLength="310.393" font-weight="700" font-family="Arial">Da Informação Coletada ao Requisito Validado</text></g><ellipse cx="210.767" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="24.736" y="92.099" width="372.061" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="34.736" y="113.354" fill="#2C3E50" font-size="12" textLength="194.789" font-family="Arial">Stakeholder relata uma necessidade</text><text x="34.736" y="127.153" fill="#2C3E50" font-size="12" textLength="352.061" font-family="Arial">(ex.: "quando eu receber um pedido, quero saber imediatamente")</text><rect x="16" y="159.696" width="389.533" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="26" y="180.952" fill="#2C3E50" font-size="12" textLength="208.793" font-family="Arial">Analista escolhe a técnica de elicitação</text><text x="26" y="194.751" fill="#2C3E50" font-size="12" textLength="369.533" font-family="Arial">(entrevista, observação, análise documental, workshop, prototipação)</text><rect x="141.396" y="227.294" width="138.74" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="151.396" y="248.55" fill="#2C3E50" font-size="12" textLength="118.74" font-family="Arial">Informação é coletada</text><rect x="117.048" y="325.093" width="187.438" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x