<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:523px;height:897px;background:#FFFFFF;" width="523px" height="897px" viewBox="0 0 523 897" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="30.139" y="33.132" fill="#000" font-size="14" textLength="461.316" font-weight="700" font-family="Arial">Ciclo de Vida de um Projeto de Software — Engenharia de Software II</text></g><ellipse cx="260.301" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="120.888" y="92.099" width="278.826" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="130.888" y="113.354" fill="#2C3E50" font-size="12" textLength="152.092" font-family="Arial">1. Identificação do Problema</text><text x="130.888" y="127.153" fill="#2C3E50" font-size="12" textLength="258.826" font-family="Arial">(qual necessidade, quem enfrenta, valor gerado)</text><rect x="159.586" y="159.696" width="201.43" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="169.586" y="180.952" fill="#2C3E50" font-size="12" textLength="165.439" font-family="Arial">2. Levantamento de Requisitos</text><text x="169.586" y="194.751" fill="#2C3E50" font-size="12" textLength="181.43" font-family="Arial">(elicitação junto aos stakeholders)</text><rect x="146.575" y="227.294" width="227.451" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="156.575" y="248.55" fill="#2C3E50" font-size="12" textLength="140.08" font-family="Arial">3. Análise e Especificação</text><text x="156.575" y="262.349" fill="#2C3E50" font-size="12" textLength="207.451" font-family="Arial">(requisitos funcionais e não funcionais)</text><rect x="151.254" y="294.892" width="218.094" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="161.254" y="316.147" fill="#2C3E50" font-size="12" textLength="144.762" font-family="Arial">4. Planejamento do Projeto</text><text x="161.254" y="329.946" fill="#2C3E50" font-size="12" textLength="198.094" font-family="Arial">(escopo, cronograma, riscos, equipe)</text><rect x="131.262" y="362.489" width="258.078" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="141.262" y="383.745" fill="#2C3E50" font-size="12" textLength="139.412" font-family="Arial">5. Arquitetura de Software</text><text x="141.262" y="397.544" fill="#2C3E50" font-size="12" textLength="238.078" font-family="Arial">(camadas, MVC, hexagonal, microsserviços)</text><rect x="122.241" y="430.087" width="276.119" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="132.241" y="451.343" fill="#2C3E50" font-size="12" textLength="109.406" font-family="Arial">6. Projeto Detalhado</text><text x="132.241" y="465.142" fill="#2C3E50" font-size="12" textLength="256.119" font-family="Arial">(classes, interfaces, SOLID, padrões de projeto)</text><rect x="113.227" y="497.685" width="294.148" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="123.227" y="518.94" fill="#2C3E50" font-size="12" textLength="95.385" font-family="Arial">7. Implementação</text><text x="123.227" y="532.739" fill="#2C3E50" font-size="12" textLength="274.148" font-family="Arial">(codificação, controle de versão, revisão de código)</text><rect x="158.578" y="565.282" width="203.445" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="168.578" y="586.538" fill="#2C3E50" font-size="12" textLength="183.445" font-family="Arial">8. Testes e Garantia da Qualidade</text><text x="168.578" y="600.337" fill="#2C3E50" font-size="12" textLength="180.768" font-family="Arial">(unitários, integração, end-to-end)</text><rect x="148.567" y="632.88" width="223.467" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="158.567" y="654.136" fill="#2C3E50" font-size="12" textLength="203.467" font-family="Arial">9. Integração, Configuração e Entrega</text><text x="158.567" y="667.935" fill="#2C3E50" font-size="12" textLength="198.727" font-family="Arial">(CI/CD: commit, build, testes, deploy)</text><rect x="132.246" y="700.478" width="256.109" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="142.246" y="721.733" fill="#2C3E50" font-size="12" textLength="208.137" font-family="Arial">10. Operação, Manutenção e Evolução</text><text x="142.246" y="735.532" fill="#2C3E50" font-size="12" textLength="236.109" font-family="Arial">(monitoramento, correções, novas entregas)</text><polygon points="169.574,768.075,351.027,768.075,363.027,780.075,351.027,792.075,169.574,792.075,157.574,780.075,169.574,768.075" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="169.574" y="784.432" fill="#2C3E50" font-size="12" textLength="181.453" font-family="Arial">Novo feedback ou novo requisito?</text><text x="137.357" y="777.32" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="363.027" y="777.32" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="16" y="802.075" width="234.805" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="26" y="823.331" fill="#2C3E50" font-size="12" textLength="214.805" font-family="Arial">Retorna ao Levantamento de Requisitos</text><ellipse cx="133.402" cy="866.874" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="133.402" cy="866.874" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/>