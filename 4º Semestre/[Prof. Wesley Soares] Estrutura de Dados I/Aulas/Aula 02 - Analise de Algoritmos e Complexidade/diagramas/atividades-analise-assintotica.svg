<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:458px;height:728px;background:#FFFFFF;" width="458px" height="728px" viewBox="0 0 458 728" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="62.38" y="33.132" fill="#000" font-size="14" textLength="331.413" font-weight="700" font-family="Arial">Processo de Análise Assintótica de um Algoritmo</text></g><ellipse cx="239.926" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="162.218" y="92.099" width="155.416" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="172.218" y="113.354" fill="#2C3E50" font-size="12" textLength="135.416" font-family="Arial">Ler o código do algoritmo</text><rect x="129.195" y="145.897" width="221.463" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="139.195" y="167.153" fill="#2C3E50" font-size="12" textLength="176.109" font-family="Arial">Contar as operações executadas</text><text x="139.195" y="180.952" fill="#2C3E50" font-size="12" textLength="201.463" font-family="Arial">em função do tamanho da entrada (n)</text><rect x="138.552" y="213.495" width="202.748" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="148.552" y="234.751" fill="#2C3E50" font-size="12" textLength="182.748" font-family="Arial">Determinar a função de custo T(n)</text><text x="148.552" y="248.55" fill="#2C3E50" font-size="12" textLength="103.377" font-family="Arial">(ex: T(n) = 3n + 10)</text><rect x="160.897" y="281.093" width="158.059" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="170.897" y="302.349" fill="#2C3E50" font-size="12" textLength="113.385" font-family="Arial">Descartar constantes</text><text x="170.897" y="316.147" fill="#2C3E50" font-size="12" textLength="138.059" font-family="Arial">e termos de menor ordem</text><rect x="152.219" y="348.69" width="175.414" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="162.219" y="369.946" fill="#2C3E50" font-size="12" textLength="155.414" font-family="Arial">Identificar o termo dominante</text><text x="162.219" y="383.745" fill="#2C3E50" font-size="12" textLength="34.008" font-family="Arial">(ex: n)</text><rect x="117.91" y="416.288" width="244.033" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="127.91" y="437.544" fill="#2C3E50" font-size="12" textLength="182.068" font-family="Arial">Classificar em uma notação Big-O</text><text x="127.91" y="451.343" fill="#2C3E50" font-size="12" textLength="224.033" font-family="Arial">(O(1), O(log n), O(n), O(n log n), O(n²), ...)</text><polygon points="171.559,483.886,308.293,483.886,320.293,497.685,308.293,511.483,171.559,511.483,159.559,497.685,171.559,483.886" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="171.559" y="495.142" fill="#2C3E50" font-size="12" textLength="116.051" font-family="Arial">Existe outro algoritmo</text><text x="171.559" y="508.94" fill="#2C3E50" font-size="12" textLength="136.734" font-family="Arial">para o mesmo problema?</text><text x="139.342" y="494.93" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="320.293" y="494.93" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="16" y="521.483" width="226.766" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="26" y="542.739" fill="#2C3E50" font-size="12" textLength="206.766" font-family="Arial">Comparar as classes de complexidade</text><text x="26" y="556.538" fill="#2C3E50" font-size="12" textLength="103.383" font-family="Arial">dos dois algoritmos</text><rect x="26.342" y="589.081" width="206.082" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="36.342" y="610.337" fill="#2C3E50" font-size="12" textLength="186.082" font-family="Arial">Escolher o algoritmo mais eficiente</text><text x="36.342" y="624.136" fill="#2C3E50" font-size="12" textLength="120.75" font-family="Arial">para entradas grandes</text><rect x="262.766" y="521.483" width="175.408" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="272.766" y="542.739" fill="#2C3E50" font-size="12" textLength="136.066" font-family="Arial">Registrar a complexidade</text><text x="272.766" y="556.538" fill="#2C3E50" font-size="12" textLength="155.408" font-family="Arial">como referência do algoritmo</text><polygon points="239.926,642.679,251.926,654.679,239.926,666.679,227.926,654.679,239.926,642.679" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="239.926" cy="697.679" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="239.926" cy="697.679" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="239.926" y1="72.099" x2="239.926" y2="92.099" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="235.926,82.099,239.926,92.099,243.926,82.099,239.926,86.099" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="239.926" y1="125.897" x2="239.926" y2="145.897" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="235.926,135.897,239.926,145.897,243.926,135.897,239.926,139.897" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="239.926" y1="193.495" x2="239.926" y2="213.495" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="235.926,203.495,