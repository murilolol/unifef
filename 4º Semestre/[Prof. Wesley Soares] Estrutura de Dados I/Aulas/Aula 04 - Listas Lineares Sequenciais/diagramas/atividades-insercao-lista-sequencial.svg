<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:445px;height:816px;background:#FFFFFF;" width="445px" height="816px" viewBox="0 0 445 816" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="20" y="33.132" fill="#000" font-size="14" textLength="403.04" font-weight="700" font-family="Arial">Inserção em uma posição arbitrária de uma Lista Sequencial</text></g><ellipse cx="212.513" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="121.806" y="92.099" width="181.414" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="131.806" y="113.354" fill="#2C3E50" font-size="12" textLength="161.414" font-family="Arial">Recebe indice e valor a inserir</text><rect x="107.116" y="195.372" width="210.793" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="117.116" y="216.628" fill="#2C3E50" font-size="12" textLength="190.793" font-family="Arial">Lança IndexOutOfBoundsException</text><ellipse cx="212.513" cy="268.771" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="212.513" cy="268.771" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="127.452,145.897,297.573,145.897,309.573,157.897,297.573,169.897,127.452,169.897,115.452,157.897,127.452,145.897" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="216.513" y="182.091" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="127.452" y="162.254" fill="#2C3E50" font-size="12" textLength="170.121" font-family="Arial">indice &lt; 0 ou indice > tamanho?</text><text x="309.573" y="155.143" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="128.462" y="371.246" width="168.102" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="138.462" y="392.501" fill="#2C3E50" font-size="12" textLength="148.102" font-family="Arial">Lança IllegalStateException</text><text x="138.462" y="406.3" fill="#2C3E50" font-size="12" textLength="73.881" font-family="Arial">("Lista cheia")</text><ellipse cx="212.513" cy="451.544" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="212.513" cy="451.544" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="144.793,321.771,280.232,321.771,292.232,333.771,280.232,345.771,144.793,345.771,132.793,333.771,144.793,321.771" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="216.513" y="357.965" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="144.793" y="338.128" fill="#2C3E50" font-size="12" textLength="135.439" font-family="Arial">tamanho == capacidade?</text><text x="292.232" y="331.016" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="98.131" y="504.544" width="228.764" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="108.131" y="525.8" fill="#2C3E50" font-size="12" textLength="208.764" font-family="Arial">Percorre do último elemento (tamanho)</text><text x="108.131" y="539.599" fill="#2C3E50" font-size="12" textLength="106.072" font-family="Arial">até a posição indice</text><rect x="121.645" y="572.142" width="181.736" height="61.396" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="131.645" y="593.398" fill="#2C3E50" font-size="12" textLength="125.408" font-family="Arial">Desloca cada elemento</text><text x="131.645" y="607.197" fill="#2C3E50" font-size="12" textLength="141.416" font-family="Arial">uma posição para a direita</text><text x="131.645" y="620.996" fill="#2C3E50" font-size="12" textLength="161.736" font-family="Arial">(elementos[i] = elementos[i-1])</text><rect x="123.133" y="653.539" width="178.76" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="133.133" y="674.794" fill="#2C3E50" font-size="12" textLength="158.76" font-family="Arial">Insere valor na posição indice</text><text x="133.133" y="688.593" fill="#2C3E50" font-size="12" textLength="141.064" font-family="Arial">(elementos[indice] = valor)</text><rect x="111.461" y="721.136" width="202.104" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="121.461" y="742.392" fill="#2C3E50" font-size="12" textLength="182.104" font-family="Arial">Incrementa tamanho (tamanho++)</text><ellipse cx="212.513" cy="785.935" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="212.513" cy="785.935" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="212.513" y1="72.099" x2="212.513" y2="92.099" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="208.513,82.099,212.513,92.099,216.513,82.099,212.513,86.099" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="212.513" y1="229.171" x2="212.513" y2="257.771" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="208.513,247.771,212.513,257.771,216.513,247.771,212.513,251.771" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="212.513" y1="169.897" x2="212.513" y2="195.372" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="208.513,185.372,212.513,195.372,216.513,185.372,212.513,189.372" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="309.573" y1="157.897" x2="327.909" y2="157.897" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="323.909,22