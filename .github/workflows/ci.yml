name: UniFEF Academic Hub CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validação de Integridade e Tamanho
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Auditoria de Tamanho de Arquivos (< 50MB)
        run: |
          echo "🔍 Verificando se há arquivos que excedem o limite de 50MB..."
          LARGE_FILES=$(find . -type f -size +50M ! -path "./.git/*")
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Arquivos acima de 50MB detectados:"
            echo "$LARGE_FILES"
            exit 1
          else
            echo "✅ Todos os arquivos estão dentro dos limites seguros (< 50MB)."
          fi

      - name: Validação de Sintaxe Markdown
        run: |
          echo "📝 Verificando estrutura e fechamento de blocos nos arquivos Markdown..."
          python3 -c "
          import os, glob
          errors = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root: continue
              for f in files:
                  if f.endswith('.md'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as md:
                          content = md.read()
                          ticks = content.count('\`\`\`')
                          if ticks % 2 != 0:
                              print(f'⚠️ Bloco desbalanceado em: {p}')
                              errors += 1
          if errors > 0:
              print(f'Total de {errors} alertas de sintaxe.')
          else:
              print('✅ Todos os arquivos Markdown estão balanceados.')
          "
