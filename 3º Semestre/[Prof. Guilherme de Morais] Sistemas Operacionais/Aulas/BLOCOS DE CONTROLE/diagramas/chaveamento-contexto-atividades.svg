<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:360px;height:674px;background:#FFFFFF;" width="360px" height="674px" viewBox="0 0 360 674" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="20" y="33.132" fill="#000" font-size="14" textLength="318.979" font-weight="700" font-family="Arial">Chaveamento de contexto entre dois processos</text></g><ellipse cx="178.489" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="44.763" y="92.099" width="267.453" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="54.763" y="113.354" fill="#2C3E50" font-size="12" textLength="143.42" font-family="Arial">Evento dispara interrupção</text><text x="54.763" y="127.153" fill="#2C3E50" font-size="12" textLength="247.453" font-family="Arial">(fim de quantum, E/S ou chamada de sistema)</text><rect x="56.095" y="159.696" width="244.789" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="66.095" y="180.952" fill="#2C3E50" font-size="12" textLength="224.789" font-family="Arial">Núcleo assume o controle do processador</text><rect x="73.77" y="213.495" width="209.439" height="61.396" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="83.77" y="234.751" fill="#2C3E50" font-size="12" textLength="176.789" font-family="Arial">Salva o contexto de execução do</text><text x="83.77" y="248.55" fill="#2C3E50" font-size="12" textLength="158.742" font-family="Arial">processo atual (registradores,</text><text x="83.77" y="262.349" fill="#2C3E50" font-size="12" textLength="189.439" font-family="Arial">contador de programa) no seu PCB</text><rect x="62.634" y="294.892" width="231.711" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="72.634" y="316.147" fill="#2C3E50" font-size="12" textLength="190.125" font-family="Arial">Atualiza o estado do processo atual</text><text x="72.634" y="329.946" fill="#2C3E50" font-size="12" textLength="211.711" font-family="Arial">no PCB (ex.: EXECUÇÃO -> PRONTO)</text><rect x="59.092" y="362.489" width="238.795" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="69.092" y="383.745" fill="#2C3E50" font-size="12" textLength="180.773" font-family="Arial">Despachante seleciona o próximo</text><text x="69.092" y="397.544" fill="#2C3E50" font-size="12" textLength="218.795" font-family="Arial">processo pronto na Tabela de Processos</text><rect x="58.77" y="430.087" width="239.439" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="68.77" y="451.343" fill="#2C3E50" font-size="12" textLength="173.443" font-family="Arial">Carrega o contexto de execução</text><text x="68.77" y="465.142" fill="#2C3E50" font-size="12" textLength="219.439" font-family="Arial">do próximo processo a partir do seu PCB</text><rect x="73.427" y="497.685" width="210.125" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="83.427" y="518.94" fill="#2C3E50" font-size="12" textLength="190.125" font-family="Arial">Atualiza o estado do novo processo</text><text x="83.427" y="532.739" fill="#2C3E50" font-size="12" textLength="116.033" font-family="Arial">para EM EXECUÇÃO</text><rect x="78.771" y="565.282" width="199.438" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="88.771" y="586.538" fill="#2C3E50" font-size="12" textLength="172.758" font-family="Arial">Processador retoma a execução</text><text x="88.771" y="600.337" fill="#2C3E50" font-size="12" textLength="179.438" font-family="Arial">com o contexto do novo processo</text><ellipse cx="178.489" cy="643.88" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="178.489" cy="643.88" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="178.489" y1="72.099" x2="178.489" y2="92.099" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,82.099,178.489,92.099,182.489,82.099,178.489,86.099" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="139.696" x2="178.489" y2="159.696" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,149.696,178.489,159.696,182.489,149.696,178.489,153.696" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="193.495" x2="178.489" y2="213.495" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,203.495,178.489,213.495,182.489,203.495,178.489,207.495" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="274.892" x2="178.489" y2="294.892" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,284.892,178.489,294.892,182.489,284.892,178.489,288.892" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="342.489" x2="178.489" y2="362.489" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,352.489,178.489,362.489,182.489,352.489,178.489,356.489" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="410.087" x2="178.489" y2="430.087" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.489,420.087,178.489,430.087,182.489,420.087,178.489,424.087" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.489" y1="477.685" x2="178.489" y2="497.685" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="174.