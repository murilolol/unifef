<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:746px;height:741px;background:#FFFFFF;" width="746px" height="741px" viewBox="0 0 746 741" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="22"><text x="155.669" y="33.132" fill="#000" font-size="14" textLength="433.351" font-weight="700" font-family="Arial">Fluxo de decisão: sistema monoprogramável x multiprogramável</text></g><ellipse cx="313.323" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="200.263" y="92.099" width="226.121" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="210.263" y="113.354" fill="#2C3E50" font-size="12" textLength="206.121" font-family="Arial">Processo A é despachado para a CPU</text><polygon points="235.625,145.897,391.021,145.897,403.021,157.897,391.021,169.897,235.625,169.897,223.625,157.897,235.625,145.897" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.625" y="162.254" fill="#2C3E50" font-size="12" textLength="155.396" font-family="Arial">Sistema é multiprogramável?</text><text x="201.935" y="155.143" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><text x="403.021" y="155.143" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><rect x="16" y="179.897" width="217.461" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="26" y="201.153" fill="#2C3E50" font-size="12" textLength="170.76" font-family="Arial">CPU permanece ociosa durante</text><text x="26" y="214.952" fill="#2C3E50" font-size="12" textLength="197.461" font-family="Arial">toda operação de E/S do Processo A</text><rect x="22.683" y="262.495" width="204.096" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="32.683" y="283.751" fill="#2C3E50" font-size="12" textLength="184.096" font-family="Arial">Ciclos de clock são desperdiçados</text><ellipse cx="124.73" cy="342.294" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="124.73" cy="342.294" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="401.527,179.897,602.305,179.897,614.305,191.897,602.305,203.897,401.527,203.897,389.527,191.897,401.527,179.897" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="401.527" y="196.254" fill="#2C3E50" font-size="12" textLength="200.777" font-family="Arial">Processo A solicita operação de E/S?</text><text x="369.31" y="189.143" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="614.305" y="189.143" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="277.143" y="213.897" width="204.77" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="287.143" y="235.153" fill="#2C3E50" font-size="12" textLength="184.77" font-family="Arial">Processo A entrega o processador</text><text x="287.143" y="248.952" fill="#2C3E50" font-size="12" textLength="158.754" font-family="Arial">voluntariamente (bloqueia-se)</text><rect x="263.461" y="296.495" width="232.133" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="273.461" y="317.751" fill="#2C3E50" font-size="12" textLength="135.387" font-family="Arial">SO realiza time-sharing e</text><text x="273.461" y="331.55" fill="#2C3E50" font-size="12" textLength="212.133" font-family="Arial">despacha Processo B da fila de prontos</text><rect x="282.152" y="373.294" width="194.75" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="292.152" y="394.55" fill="#2C3E50" font-size="12" textLength="174.75" font-family="Arial">Processo B utiliza o processador</text><text x="292.152" y="408.349" fill="#2C3E50" font-size="12" textLength="131.438" font-family="Arial">enquanto A aguarda E/S</text><rect x="286.813" y="440.892" width="185.428" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="296.813" y="462.147" fill="#2C3E50" font-size="12" textLength="165.428" font-family="Arial">E/S do Processo A é concluída</text><rect x="303.501" y="494.69" width="152.053" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="313.501" y="515.946" fill="#2C3E50" font-size="12" textLength="132.053" font-family="Arial">SO promove Processo A</text><text x="313.501" y="529.745" fill="#2C3E50" font-size="12" textLength="118.74" font-family="Arial">para a lista de prontos</text><rect x="521.92" y="213.897" width="204.77" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="531.92" y="235.153" fill="#2C3E50" font-size="12" textLength="184.77" font-family="Arial">Processo A continua em execução</text><text x="531.92" y="248.952" fill="#2C3E50" font-size="12" textLength="135.416" font-family="Arial">até o fim do seu quantum</text><polygon points="501.916,548.288,513.916,560.288,501.916,572.288,489.916,560.288,501.916,548.288" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="405.531" y="592.288" width="192.77" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="415.531" y="613.544" fill="#2C3E50" font-size="12" textLength="172.77" font-family="Arial">Throughput do sistema aumenta</text><rect x="413.201" y="646.087" width="177.43" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="423.201" y="667.343" fill="#2C3E50" font-size="12" textLength="157.43" font-family="Arial">Turnaround médio é reduzido</text><ellipse cx="313.323" cy="710.886" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="313.323" cy="710.886" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="313.323" y1="72.099" x2="313.323" y2="92.099" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="309.323,82.099,313.323,92.099,317.323,82.099,313.323,86.099" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="124.73" y1="227.495" x2="124.73" y2="262.495" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="120.73,252.495,124.73,262.495,128.73,252.495,124.73,256.495" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="124.73" y1="296.294" x2="124.73" y2="331.294" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="120.73,321.294,124.73,331.294,128.73,321.294,124.73,325.294" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="379.527" y1="261.495" x2="379.527" y2="296.495" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="375.527,286.495,379.527,296.495,383.527,286.495,379.527,290.495" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="379.527" y1="344.093" x2="379.527" y2="373.294" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="375.527,363.294,379.527,373.294,383.527,363.294,379.527,367.294" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="379.527" y1="420.892" x2="379.527" y2="440.892" style="stroke:#34495E;stroke-width:1.2;"/><polygon points="375.527,430.892,379.527,440.892,383.527,430.892,379.527,434.892" fill="#34495E" style="stroke:#34495E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="379.527" y1="474.69" x2="379.527" y2="494.6