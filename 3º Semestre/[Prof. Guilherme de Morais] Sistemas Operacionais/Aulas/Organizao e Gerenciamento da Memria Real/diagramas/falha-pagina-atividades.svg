ágina é carregada do disco</text><text x="238.762" y="384.147" fill="#2C3E50" font-size="12" textLength="93.369" font-family="Arial">para o frame livre</text><rect x="549.615" y="349.093" width="160.027" height="61.396" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="559.615" y="370.349" fill="#2C3E50" font-size="12" textLength="137.414" font-family="Arial">Estratégia de substituição</text><text x="559.615" y="384.147" fill="#2C3E50" font-size="12" textLength="140.027" font-family="Arial">(FIFO, LRU, LFU) escolhe</text><text x="559.615" y="397.946" fill="#2C3E50" font-size="12" textLength="98.051" font-family="Arial">uma página vítima</text><polygon points="551.254,430.489,708.004,430.489,720.004,442.489,708.004,454.489,551.254,454.489,539.254,442.489,551.254,430.489" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="551.254" y="446.846" fill="#2C3E50" font-size="12" textLength="156.75" font-family="Arial">Página vítima foi modificada?</text><text x="519.037" y="439.734" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="720.004" y="439.734" fill="#000" font-size="13" textLength="21.69" font-family="Arial">não</text><rect x="431.533" y="464.489" width="195.441" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="441.533" y="485.745" fill="#2C3E50" font-size="12" textLength="129.41" font-family="Arial">Página vítima é gravada</text><text x="441.533" y="499.544" fill="#2C3E50" font-size="12" textLength="175.441" font-family="Arial">no disco antes de ser substituída</text><rect x="647.295" y="464.489" width="165.418" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="657.295" y="485.745" fill="#2C3E50" font-size="12" textLength="145.418" font-family="Arial">Página vítima é descartada</text><text x="657.295" y="499.544" fill="#2C3E50" font-s