765" y="262.74" fill="#000" font-size="13" textLength="121.399" font-family="Arial">não, R2 está com P2</text><rect x="27.318" y="287.495" width="167.416" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="37.318" y="308.751" fill="#2C3E50" font-size="12" textLength="120.732" font-family="Arial">P1 obtém R2 e conclui</text><text x="37.318" y="322.55" fill="#2C3E50" font-size="12" textLength="147.416" font-family="Arial">sua execução normalmente</text><ellipse cx="111.026" cy="366.093" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="111.026" cy="366.093" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="214.734" y="287.495" width="164.744" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="224.734" y="308.751" fill="#2C3E50" font-size="12" textLength="144.744" font-family="Arial">P1 entra em espera por R2</text><rect x="126.366" y="397.093" width="155.398" height="33.799" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="136.366" y="418.349" fill="#2C3E50" font-size="12" textLength="135.398" font-family="Arial">P2 requisita o recurso R1</text><polygon points="151.366,450.892,256.765,450.892,268.765,462.892,256.765,474.892,151.366,474.892,139.366,462.892,151.366,450.892" fill="#F8F9FA" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="151.366" y="467.248" fill="#2C3E50" font-size="12" textLength="105.398" font-family="Arial">R1 está disponível?</text><text x="119.149" y="460.137" fill="#000" font-size="13" textLength="20.217" font-family="Arial">sim</text><text x="268.765" y="460.137" fill="#000" font-size="13" textLength="121.399" font-family="Arial">não, R1 está com P1</text><rect x="27.318" y="484.892" width="167.416" height="47.598" fill="#E8F4FD" style="stroke:#3498DB;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="37.318" y="506.14